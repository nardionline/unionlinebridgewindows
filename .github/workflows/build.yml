name: Build Unionline Print Bridge
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file EXE
        run: dotnet publish UnionlinePrintBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: UnionlinePrintBridge-win-x64
          path: publish/UnionlinePrintBridge.exe
          if-no-files-found: error
